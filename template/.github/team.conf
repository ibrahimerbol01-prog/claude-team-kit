# Настройки команды для scripts/team.sh. Секретов здесь нет и быть не должно.

# GitHub-логин владельца: только он сливает в main.
OWNER=your-github-login

# Участники: MEMBER=логин:роль
# Роли: lead, frontend, backend, content, qa, design (описание в docs/team/ROLES.md)
MEMBER=your-github-login:lead
# MEMBER=login2:frontend
# MEMBER=login3:backend
# MEMBER=login4:content
# MEMBER=login5:qa
# MEMBER=login6:design

# Основная ветка.
MAIN_BRANCH=main

# Команда проверок перед PR (пусто — пропустить).
CHECK_CMD=
