name: Ошибка
description: Что-то работает не так
labels: ["type:bug", "status:ready"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Как повторить
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидалось и что произошло
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Насколько мешает
      options: ["блокирует демо", "мешает", "косметика"]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Ошибки из консоли, скриншот
      description: Перед вставкой уберите ключи и токены.
